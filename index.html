<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scientific Calculator Pro</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            background: #121212;
            color: #cdd6f4;
            padding: 24px 12px;
        }
        .app-wrapper {
            width: 100%;
            max-width: 460px;
            background: #1e1e2e;
            padding: 18px;
            border-radius: 16px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.65);
        }
        .top-tabs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-bottom: 14px;
            background: #141420;
            padding: 5px;
            border-radius: 10px;
        }
        .tab-btn {
            background: transparent;
            color: #a6adc8;
            border: none;
            padding: 8px 6px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: 0.2s;
        }
        .tab-btn.active {
            background: #313244;
            color: #89b4fa;
        }
        .tab-panel {
            display: none;
        }
        .tab-panel.active {
            display: block;
        }
        .mode-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            color: #a6adc8;
            font-size: 12px;
            gap: 8px;
            flex-wrap: wrap;
        }
        .action-row {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .small-btn {
            background: #313244;
            color: #cdd6f4;
            border: none;
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
        }
        .small-btn:hover {
            background: #45475a;
        }
        .display {
            width: 100%;
            background: #11111b;
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 14px;
            text-align: right;
            border: 1px solid #313244;
        }
        #historyLine {
            color: #7f849c;
            font-size: 13px;
            min-height: 18px;
            overflow-x: auto;
        }
        #screen {
            width: 100%;
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 26px;
            text-align: right;
            outline: none;
            margin-top: 4px;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 7px;
        }
        .calc-btn {
            padding: 12px 4px;
            font-size: 14px;
            border: none;
            border-radius: 8px;
            background: #313244;
            color: #cdd6f4;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
        }
        .calc-btn:hover {
            background: #45475a;
        }
        .calc-btn:active {
            transform: scale(0.96);
        }
        .sci {
            background: #252637;
            color: #89b4fa;
            font-size: 12.5px;
        }
        .op {
            background: #3b3d54;
            color: #f9e2af;
            font-weight: bold;
        }
        .clear {
            background: #f38ba8;
            color: #11111b;
            font-weight: bold;
        }
        .equal {
            background: #a6e3a1;
            color: #11111b;
            font-weight: bold;
            grid-column: span 2;
        }
        .history-box {
            margin-top: 16px;
            background: #161622;
            border: 1px solid #2b2c3d;
            border-radius: 10px;
            padding: 12px;
        }
        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 13px;
            color: #bac2de;
        }
        .history-list {
            max-height: 150px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .history-item {
            background: #232436;
            padding: 8px 10px;
            border-radius: 7px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }
        .history-item:hover {
            background: #2e3047;
        }
        .history-expr {
            color: #a6adc8;
        }
        .history-res {
            color: #a6e3a1;
            font-weight: bold;
        }
        .solver-card {
            background: #161622;
            border: 1px solid #2b2c3d;
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 14px;
        }
        .solver-card h3 {
            font-size: 15px;
            color: #89b4fa;
            margin-bottom: 10px;
        }
        .input-grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 10px;
        }
        .matrix-2x2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
            width: 110px;
        }
        .matrices-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        input[type="number"], select {
            width: 100%;
            padding: 8px;
            border-radius: 7px;
            border: 1px solid #313244;
            background: #11111b;
            color: #ffffff;
            font-size: 14px;
            outline: none;
        }
        .primary-btn {
            background: #89b4fa;
            color: #11111b;
            border: none;
            padding: 9px 14px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
        }
        .result-box {
            margin-top: 10px;
            background: #11111b;
            padding: 10px;
            border-radius: 8px;
            font-size: 13.5px;
            color: #a6e3a1;
            min-height: 38px;
            white-space: pre-line;
        }
    </style>
</head>
<body>

<div class="app-wrapper">
    <div class="top-tabs">
        <button class="tab-btn active" onclick="switchTab('calcTab', this)">Scientific</button>
        <button class="tab-btn" onclick="switchTab('quadTab', this)">Quadratic</button>
        <button class="tab-btn" onclick="switchTab('matTab', this)">Matrix 2×2</button>
    </div>

    <!-- TAB 1: SCIENTIFIC CALCULATOR -->
    <div id="calcTab" class="tab-panel active">
        <div class="mode-bar">
            <span>SCIENTIFIC + HYPERBOLIC + nPr/nCr</span>
            <div class="action-row">
                <button class="small-btn" id="angleMode" onclick="toggleMode()">DEG</button>
                <button class="small-btn" id="copyBtn" onclick="copyResult()">Copy</button>
            </div>
        </div>

        <div class="display">
            <div id="historyLine"></div>
            <input type="text" id="screen" readonly placeholder="0">
        </div>

        <div class="buttons">
            <!-- Row 1 -->
            <button class="calc-btn sci" onclick="appendFunc('sin(')">sin</button>
            <button class="calc-btn sci" onclick="appendFunc('cos(')">cos</button>
            <button class="calc-btn sci" onclick="appendFunc('tan(')">tan</button>
            <button class="calc-btn clear" onclick="clearAll()">AC</button>
            <button class="calc-btn clear" onclick="backspace()">DEL</button>

            <!-- Row 2 -->
            <button class="calc-btn sci" onclick="appendFunc('sinh(')">sinh</button>
            <button class="calc-btn sci" onclick="appendFunc('cosh(')">cosh</button>
            <button class="calc-btn sci" onclick="appendFunc('tanh(')">tanh</button>
            <button class="calc-btn sci" onclick="appendValue('(')">(</button>
            <button class="calc-btn sci" onclick="appendValue(')')">)</button>

            <!-- Row 3 -->
            <button class="calc-btn sci" onclick="appendFunc('asin(')">sin⁻¹</button>
            <button class="calc-btn sci" onclick="appendFunc('acos(')">cos⁻¹</button>
            <button class="calc-btn sci" onclick="appendFunc('atan(')">tan⁻¹</button>
            <button class="calc-btn sci" onclick="appendValue('P')">nPr</button>
            <button class="calc-btn sci" onclick="appendValue('C')">nCr</button>

            <!-- Row 4 -->
            <button class="calc-btn sci" onclick="appendFunc('log(')">log</button>
            <button class="calc-btn sci" onclick="appendFunc('ln(')">ln</button>
            <button class="calc-btn sci" onclick="appendFunc('cbrt(')">∛x</button>
            <button class="calc-btn sci" onclick="appendFunc('sqrt(')">√x</button>
            <button class="calc-btn sci" onclick="appendValue('!')">n!</button>

            <!-- Row 5 -->
            <button class="calc-btn sci" onclick="appendFunc('10^(')">10ˣ</button>
            <button class="calc-btn sci" onclick="appendFunc('e^(')">eˣ</button>
            <button class="calc-btn sci" onclick="appendValue('^')">xʸ</button>
            <button class="calc-btn sci" onclick="appendValue('π')">π</button>
            <button class="calc-btn sci" onclick="appendValue('e')">e</button>

            <!-- Row 6 -->
            <button class="calc-btn" onclick="appendValue('7')">7</button>
            <button class="calc-btn" onclick="appendValue('8')">8</button>
            <button class="calc-btn" onclick="appendValue('9')">9</button>
            <button class="calc-btn op" onclick="appendValue('/')">÷</button>
            <button class="calc-btn sci" onclick="appendValue('%')">%</button>

            <!-- Row 7 -->
            <button class="calc-btn" onclick="appendValue('4')">4</button>
            <button class="calc-btn" onclick="appendValue('5')">5</button>
            <button class="calc-btn" onclick="appendValue('6')">6</button>
            <button class="calc-btn op" onclick="appendValue('*')">×</button>
            <button class="calc-btn op" onclick="appendValue('-')">−</button>

            <!-- Row 8 -->
            <button class="calc-btn" onclick="appendValue('1')">1</button>
            <button class="calc-btn" onclick="appendValue('2')">2</button>
            <button class="calc-btn" onclick="appendValue('3')">3</button>
            <button class="calc-btn op" onclick="appendValue('+')">+</button>
            <button class="calc-btn" onclick="appendValue('.')">.</button>

            <!-- Row 9 -->
            <button class="calc-btn" onclick="appendValue('0')">0</button>
            <button class="calc-btn equal" onclick="calculate()">=</button>
        </div>

        <div class="history-box">
            <div class="history-header">
                <span>Calculation History (Click to reuse)</span>
                <button class="small-btn" onclick="clearHistory()">Clear</button>
            </div>
            <div id="historyList" class="history-list"></div>
        </div>
    </div>

    <!-- TAB 2: QUADRATIC EQUATION SOLVER -->
    <div id="quadTab" class="tab-panel">
        <div class="solver-card">
            <h3>Quadratic Equation: ax² + bx + c = 0</h3>
            <div class="input-grid-3">
                <input type="number" id="quadA" placeholder="a (e.g. 1)" step="any">
                <input type="number" id="quadB" placeholder="b (e.g. -5)" step="any">
                <input type="number" id="quadC" placeholder="c (e.g. 6)" step="any">
            </div>
            <button class="primary-btn" onclick="solveQuadratic()">Solve Equation</button>
            <div id="quadResult" class="result-box">Enter a, b, and c to find roots.</div>
        </div>
    </div>

    <!-- TAB 3: 2x2 MATRIX SOLVER -->
    <div id="matTab" class="tab-panel">
        <div class="solver-card">
            <h3>2×2 Matrix Calculator</h3>
            <div class="matrices-row">
                <div>
                    <div style="font-size:12px; color:#a6adc8; margin-bottom:4px;">Matrix A</div>
                    <div class="matrix-2x2">
                        <input type="number" id="a11" value="1" step="any">
                        <input type="number" id="a12" value="2" step="any">
                        <input type="number" id="a21" value="3" step="any">
                        <input type="number" id="a22" value="4" step="any">
                    </div>
                </div>
                <div>
                    <div style="font-size:12px; color:#a6adc8; margin-bottom:4px;">Matrix B</div>
                    <div class="matrix-2x2">
                        <input type="number" id="b11" value="2" step="any">
                        <input type="number" id="b12" value="0" step="any">
                        <input type="number" id="b21" value="1" step="any">
                        <input type="number" id="b22" value="2" step="any">
                    </div>
                </div>
            </div>
            <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
                <select id="matOp" style="width:auto;">
                    <option value="add">A + B</option>
                    <option value="sub">A − B</option>
                    <option value="mul">A × B</option>
                    <option value="detA">det(A) & det(B)</option>
                </select>
                <button class="primary-btn" onclick="solveMatrix()">Calculate</button>
            </div>
            <div id="matResult" class="result-box">Select an operation and click Calculate.</div>
        </div>
    </div>
</div>

<script>
    const screen = document.getElementById('screen');
    const historyLine = document.getElementById('historyLine');
    const historyList = document.getElementById('historyList');
    const angleBtn = document.getElementById('angleMode');
    let isDegree = true;
    let calcHistory = [];

    function switchTab(tabId, btn) {
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        btn.classList.add('active');
    }

    function toggleMode() {
        isDegree = !isDegree;
        angleBtn.innerText = isDegree ? 'DEG' : 'RAD';
    }

    function appendValue(val) {
        if (screen.value === 'Error') screen.value = '';
        screen.value += val;
    }

    function appendFunc(func) {
        if (screen.value === 'Error') screen.value = '';
        screen.value += func;
    }

    function clearAll() {
        screen.value = '';
        historyLine.innerText = '';
    }

    function backspace() {
        if (screen.value === 'Error') {
            screen.value = '';
            return;
        }
        screen.value = screen.value.slice(0, -1);
    }

    function factorial(n) {
        if (n < 0 || !Number.isInteger(n)) return NaN;
        if (n === 0 || n === 1) return 1;
        let res = 1;
        for (let i = 2; i <= n; i++) res *= i;
        return res;
    }

    function nPr(n, r) {
        n = Number(n); r = Number(r);
        if (!Number.isInteger(n) || !Number.isInteger(r) || n < 0 || r < 0 || r > n) return NaN;
        return factorial(n) / factorial(n - r);
    }

    function nCr(n, r) {
        n = Number(n); r = Number(r);
        if (!Number.isInteger(n) || !Number.isInteger(r) || n < 0 || r < 0 || r > n) return NaN;
        return factorial(n) / (factorial(r) * factorial(n - r));
    }

    function renderHistory() {
        historyList.innerHTML = '';
        calcHistory.slice().reverse().forEach(item => {
            const div = document.createElement('div');
            div.className = 'history-item';
            div.innerHTML = `<span class="history-expr">${item.expr}</span><span class="history-res">= ${item.res}</span>`;
            div.onclick = () => {
                screen.value = String(item.res);
                historyLine.innerText = 'From history: ' + item.expr;
            };
            historyList.appendChild(div);
        });
    }

    function clearHistory() {
        calcHistory = [];
        renderHistory();
    }

    function copyResult() {
        if (!screen.value || screen.value === 'Error') return;
        navigator.clipboard.writeText(screen.value).then(() => {
            const btn = document.getElementById('copyBtn');
            const old = btn.innerText;
            btn.innerText = 'Copied!';
            setTimeout(() => btn.innerText = old, 1200);
        });
    }

    function calculate() {
        try {
            const rawExpr = screen.value.trim();
            if (!rawExpr) return;
            historyLine.innerText = rawExpr + ' =';

            let expr = rawExpr;
            expr = expr.replace(/π/g, 'Math.PI');
            expr = expr.replace(/\be\b/g, 'Math.E');
            expr = expr.replace(/10\^\(/g, 'Math.pow(10,');
            expr = expr.replace(/e\^\(/g, 'Math.exp(');
            expr = expr.replace(/\^/g, '**');
            expr = expr.replace(/cbrt\(/g, 'Math.cbrt(');
            expr = expr.replace(/sqrt\(/g, 'Math.sqrt(');
            expr = expr.replace(/log\(/g, 'Math.log10(');
            expr = expr.replace(/ln\(/g, 'Math.log(');
            expr = expr.replace(/(\d+)!/g, 'factorial($1)');
            expr = expr.replace(/(\d+)\s*P\s*(\d+)/g, 'nPr($1,$2)');
            expr = expr.replace(/(\d+)\s*C\s*(\d+)/g, 'nCr($1,$2)');
            expr = expr.replace(/%/g, '/100');

            // Hyperbolic
            expr = expr.replace(/sinh\(([^)]+)\)/g, 'Math.sinh($1)');
            expr = expr.replace(/cosh\(([^)]+)\)/g, 'Math.cosh($1)');
            expr = expr.replace(/tanh\(([^)]+)\)/g, 'Math.tanh($1)');

            // Trig (Degree / Radian)
            const toRad = isDegree ? '*(Math.PI/180)' : '';
            const toDeg = isDegree ? '*(180/Math.PI)' : '';

            expr = expr.replace(/asin\(([^)]+)\)/g, `(Math.asin($1)${toDeg})`);
            expr = expr.replace(/acos\(([^)]+)\)/g, `(Math.acos($1)${toDeg})`);
            expr = expr.replace(/atan\(([^)]+)\)/g, `(Math.atan($1)${toDeg})`);
            expr = expr.replace(/sin\(([^)]+)\)/g, `Math.sin(($1)${toRad})`);
            expr = expr.replace(/cos\(([^)]+)\)/g, `Math.cos(($1)${toRad})`);
            expr = expr.replace(/tan\(([^)]+)\)/g, `Math.tan(($1)${toRad})`);

            let result = eval(expr);
            result = Math.round(result * 1e12) / 1e12;
            if (isNaN(result) || !isFinite(result)) {
                screen.value = 'Error';
            } else {
                screen.value = result;
                calcHistory.push({ expr: rawExpr, res: result });
                renderHistory();
            }
        } catch (e) {
            screen.value = 'Error';
        }
    }

    function solveQuadratic() {
        const a = parseFloat(document.getElementById('quadA').value);
        const b = parseFloat(document.getElementById('quadB').value);
        const c = parseFloat(document.getElementById('quadC').value);
        const out = document.getElementById('quadResult');

        if (isNaN(a) || isNaN(b) || isNaN(c) || a === 0) {
            out.innerText = 'Please enter valid numbers with a ≠ 0.';
            return;
        }
        const d = b * b - 4 * a * c;
        const round = x => Math.round(x * 1e6) / 1e6;

        if (d > 0) {
            const x1 = round((-b + Math.sqrt(d)) / (2 * a));
            const x2 = round((-b - Math.sqrt(d)) / (2 * a));
            out.innerText = `Discriminant (Δ) = ${round(d)} (> 0)\nTwo real roots:\nx₁ = ${x1}\nx₂ = ${x2}`;
        } else if (d === 0) {
            const x = round(-b / (2 * a));
            out.innerText = `Discriminant (Δ) = 0\nOne repeated real root:\nx = ${x}`;
        } else {
            const real = round(-b / (2 * a));
            const imag = round(Math.sqrt(-d) / (2 * a));
            out.innerText = `Discriminant (Δ) = ${round(d)} (< 0)\nComplex conjugate roots:\nx₁ = ${real} + ${imag}i\nx₂ = ${real} − ${imag}i`;
        }
    }

    function solveMatrix() {
        const a11 = parseFloat(document.getElementById('a11').value) || 0;
        const a12 = parseFloat(document.getElementById('a12').value) || 0;
        const a21 = parseFloat(document.getElementById('a21').value) || 0;
        const a22 = parseFloat(document.getElementById('a22').value) || 0;

        const b11 = parseFloat(document.getElementById('b11').value) || 0;
        const b12 = parseFloat(document.getElementById('b12').value) || 0;
        const b21 = parseFloat(document.getElementById('b21').value) || 0;
        const b22 = parseFloat(document.getElementById('b22').value) || 0;

        const op = document.getElementById('matOp').value;
        const out = document.getElementById('matResult');

        if (op === 'add') {
            out.innerText = `A + B =\n[ ${a11+b11}   ${a12+b12} ]\n[ ${a21+b21}   ${a22+b22} ]`;
        } else if (op === 'sub') {
            out.innerText = `A − B =\n[ ${a11-b11}   ${a12-b12} ]\n[ ${a21-b21}   ${a22-b22} ]`;
        } else if (op === 'mul') {
            const c11 = a11*b11 + a12*b21;
            const c12 = a11*b12 + a12*b22;
            const c21 = a21*b11 + a22*b21;
            const c22 = a21*b12 + a22*b22;
            out.innerText = `A × B =\n[ ${c11}   ${c12} ]\n[ ${c21}   ${c22} ]`;
        } else {
            const detA = a11*a22 - a12*a21;
            const detB = b11*b22 - b12*b21;
            out.innerText = `det(A) = ${detA}\ndet(B) = ${detB}`;
        }
    }

    document.addEventListener('keydown', (e) => {
        if (!document.getElementById('calcTab').classList.contains('active')) return;
        if ((e.key >= '0' && e.key <= '9') || ['+', '-', '*', '/', '.', '(', ')', '^', '%'].includes(e.key)) {
            appendValue(e.key);
        } else if (e.key === 'Enter') {
            e.preventDefault();
            calculate();
        } else if (e.key === 'Backspace') {
            backspace();
        } else if (e.key === 'Escape') {
            clearAll();
        }
    });
</script>

</body>
</html>
