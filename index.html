<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scientific Calculator Pro</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            background: #121212;
            color: #cdd6f4;
            padding: 24px 12px;
        }
        .app-wrapper {
            width: 100%;
            max-width: 460px;
            background: #1e1e2e;
            padding: 18px;
            border-radius: 16px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.65);
        }
        .top-tabs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-bottom: 14px;
            background: #141420;
            padding: 5px;
            border-radius: 10px;
        }
        .tab-btn {
            background: transparent;
            color: #a6adc8;
            border: none;
            padding: 8px 6px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: 0.2s;
        }
        .tab-btn.active {
            background: #313244;
            color: #89b4fa;
        }
        .tab-panel {
            display: none;
        }
        .tab-panel.active {
            display: block;
        }
        .mode-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            color: #a6adc8;
            font-size: 12px;
            gap: 8px;
            flex-wrap: wrap;
        }
        .action-row {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .small-btn {
            background: #313244;
            color: #cdd6f4;
            border: none;
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
        }
        .small-btn:hover {
            background: #45475a;
        }
        .display {
            width: 100%;
            background: #11111b;
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 14px;
            text-align: right;
            border: 1px solid #313244;
        }
        #historyLine {
            color: #7f849c;
            font-size: 13px;
            min-height: 18px;
            overflow-x: auto;
        }
        #screen {
            width: 100%;
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 26px;
            text-align: right;
            outline: none;
            margin-top: 4px;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 7px;
        }
        .calc-btn {
            padding: 12px 4px;
            font-size: 14px;
            border: none;
            border-radius: 8px;
            background: #313244;
            color: #cdd6f4;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
        }
        .calc-btn:hover {
            background: #45475a;
        }
        .calc-btn:active {
            transform: scale(0.96);
        }
        .sci {
            background: #252637;
            color: #89b4fa;
            font-size: 12.5px;
        }
        .op {
            background: #3b3d54;
            color: #f9e2af;
            font-weight: bold;
        }
        .clear {
            background: #f38ba8;
            color: #11111b;
            font-weight: bold;
        }
        .equal {
            background: #a6e3a1;
            color: #11111b;
            font-weight: bold;
            grid-column: span 2;
        }
        .history-box {
            margin-top: 16px;
            background: #161622;
            border: 1px solid #2b2c3d;
            border-radius: 10px;
            padding: 12px;
        }
        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 13px;
            color: #bac2de;
        }
        .history-list {
            max-height: 150px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .history-item {
            background: #232436;
            padding: 8px 10px;
            border-radius: 7px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }
        .history-item:hover {
            background: #2e3047;
        }
        .history-expr {
            color: #a6adc8;
        }
        .history-res {
            color: #a6e3a1;
            font-weight: bold;
        }
        .solver-card {
            background: #161622;
            border: 1px solid #2b2c3d;
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 14px;
        }
        .solver-card h3 {
            font-size: 15px;
            color: #89b4fa;
            margin-bottom: 10px;
        }
        .input-grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 10px;
        }
        .matrix-2x2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
            width: 110px;
        }
        .matrices-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        input[type="number"], select {
            width: 100%;
            padding: 8px;
            border-radius: 7px;
            border: 1px solid #313244;
            background: #11111b;
